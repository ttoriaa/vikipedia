<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ede7df"><title>Vikipedia Drive — 开车，去发现。</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237851bc'/%3E%3Ctext x='14' y='48' font-size='48' fill='white'%3Ev%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="world" aria-label="可驾驶探索的三维作品园区" tabindex="0"></div>

<aside class="intro hud"><div class="eyebrow">WELCOME TO MY LITTLE WORLD</div><h1>开车，<br>去<span>发现。</span></h1><p>每一个路口，都是一个新想法。<br>欢迎来到 Vickie 的创意园区。</p><div class="progress"><span id="progress">00 / 08</span><div><b id="progress-bar"></b></div><small>展区已探索</small></div><button id="map-open" class="text-button">打开园区地图 <kbd>M</kbd> ↗</button></aside>
<div class="zone-labels" id="labels"></div><button id="interact" class="interact hud" hidden><kbd>E</kbd><span>查看作品</span> →</button>
<div class="bottom-left hud"><div class="speed"><strong id="speed">00</strong><span>KM/H<small id="gear">P · PARK</small></span></div><div class="help"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 驾驶</span><span><kbd>SPACE</kbd> 刹车</span><button id="reset"><kbd>R</kbd> 复位</button></div></div>

<div id="toast" role="status" class="hud"></div><div id="telemetry" hidden></div>
